# Rendered on the "New issue" chooser page for photostructure-for-servers.
#
# PhotoStructure tracks bugs and feature requests on the forum, not on GitHub.
# These links say so *before* anyone starts typing, and blank_issues_enabled
# closes the "Open a blank issue" path that bypassed the templates' routing
# guidance.
#
# bin/build-dist.sh copies server/.github into the release repo, so this file
# is the source of truth — editing it in photostructure-for-servers directly
# will be overwritten by the next release.
blank_issues_enabled: false

contact_links:
  - name: Report a bug
    url: https://forum.photostructure.com/c/bug/8/l/latest
    about: Bugs are tracked on the PhotoStructure forum. Please search first — yours may already be reported.
  - name: Request a feature
    url: https://forum.photostructure.com/c/feature-requests/7/l/latest?order=votes
    about: Suggest and vote on new features. Votes help prioritize what gets built next.
  - name: Chat on Discord
    url: https://photostructure.com/go/discord
    about: Quick questions and community chat.
