name: Stage npm release
run-name: Stage ${{ github.ref_name }} on npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stage-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate signed release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      npm_tag: ${{ steps.identity.outputs.npm_tag }}
    steps:
      - name: Checkout the tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify package, tag, and signatures
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          if [[ "$PACKAGE_NAME" != photostructure || "$GITHUB_REF" != "refs/tags/v$VERSION" ]]; then
            echo "::error::The release tag must match the photostructure package version"
            exit 1
          fi

          if [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+-beta$ ]]; then
            NPM_TAG=beta
          elif [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]]; then
            NPM_TAG=latest
          else
            echo "::error::Unsupported release version: $VERSION"
            exit 1
          fi

          TAG_REF="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$REF_NAME")"
          TAG_TYPE="$(jq -r '.object.type' <<< "$TAG_REF")"
          TAG_OBJECT_SHA="$(jq -r '.object.sha' <<< "$TAG_REF")"
          if [[ "$TAG_TYPE" != tag ]]; then
            echo "::error::Release tag must be annotated"
            exit 1
          fi

          TAG_OBJECT="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA")"
          TAG_TARGET_TYPE="$(jq -r '.object.type' <<< "$TAG_OBJECT")"
          TAG_TARGET_SHA="$(jq -r '.object.sha' <<< "$TAG_OBJECT")"
          TAG_VERIFIED="$(jq -r '.verification.verified' <<< "$TAG_OBJECT")"
          COMMIT_VERIFIED="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.verification.verified')"
          if [[ "$TAG_TARGET_TYPE" != commit || "$TAG_TARGET_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag does not point directly to the workflow commit"
            exit 1
          fi
          if [[ "$TAG_VERIFIED" != true || "$COMMIT_VERIFIED" != true ]]; then
            echo "::error::Release tag and commit must have verified signatures"
            exit 1
          fi

          printf 'version=%s\nnpm_tag=%s\n' "$VERSION" "$NPM_TAG" >> "$GITHUB_OUTPUT"

  pack:
    name: Pack exact tagged artifact
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - name: Checkout the tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install exact release toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0 # Bundles npm 11.19.0, which supports staged publishing.
          package-manager-cache: false

      - name: Pack and inspect the package without executing scripts
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/npm-package"
          mkdir "$ARTIFACT_DIR"
          npm pack --json --ignore-scripts --pack-destination "$ARTIFACT_DIR" > "$ARTIFACT_DIR/pack.json"
          PACK_COUNT="$(jq 'length' "$ARTIFACT_DIR/pack.json")"
          PACK_NAME="$(jq -r '.[0].name' "$ARTIFACT_DIR/pack.json")"
          PACK_VERSION="$(jq -r '.[0].version' "$ARTIFACT_DIR/pack.json")"
          PACK_FILENAME="$(jq -r '.[0].filename' "$ARTIFACT_DIR/pack.json")"
          if [[ "$PACK_COUNT" != 1 || "$PACK_NAME" != photostructure || "$PACK_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Packed package identity does not match the signed release tag"
            exit 1
          fi
          TARBALL="$ARTIFACT_DIR/$PACK_FILENAME"
          if [[ ! -f "$TARBALL" || "$(find "$ARTIFACT_DIR" -maxdepth 1 -type f -name '*.tgz' | wc -l)" -ne 1 ]]; then
            echo "::error::Expected exactly one package tarball"
            exit 1
          fi
          tar -xOzf "$TARBALL" package/package.json |
            jq -e --arg version "$EXPECTED_VERSION" '.name == "photostructure" and .version == $version' > /dev/null
          tar -tzf "$TARBALL" | LC_ALL=C sort > "$ARTIFACT_DIR/contents.txt"

      - name: Upload the exact package for staging and review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/npm-package/*.tgz
            ${{ runner.temp }}/npm-package/pack.json
            ${{ runner.temp }}/npm-package/contents.txt
          if-no-files-found: error
          retention-days: 1

  stage:
    name: Stage package on npm
    runs-on: ubuntu-24.04
    needs: [validate, pack]
    permissions:
      contents: read
      id-token: write # npm exchanges GitHub's OIDC token for stage-only publishing.
    steps:
      - name: Download the exact package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.ref_name }}
          path: package-artifact/

      - name: Install exact release toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0 # Bundles npm 11.19.0, which supports staged publishing.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Recheck signed tag and tarball identity, then stage
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          NPM_TAG: ${{ needs.validate.outputs.npm_tag }}
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          set -euo pipefail
          TAG_REF="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$REF_NAME")"
          TAG_TYPE="$(jq -r '.object.type' <<< "$TAG_REF")"
          TAG_OBJECT_SHA="$(jq -r '.object.sha' <<< "$TAG_REF")"
          if [[ "$TAG_TYPE" != tag ]]; then
            echo "::error::Release tag is no longer annotated"
            exit 1
          fi
          TAG_OBJECT="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA")"
          TAG_TARGET_TYPE="$(jq -r '.object.type' <<< "$TAG_OBJECT")"
          TAG_TARGET_SHA="$(jq -r '.object.sha' <<< "$TAG_OBJECT")"
          TAG_VERIFIED="$(jq -r '.verification.verified' <<< "$TAG_OBJECT")"
          COMMIT_VERIFIED="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.verification.verified')"
          if [[ "$TAG_TARGET_TYPE" != commit || "$TAG_TARGET_SHA" != "$GITHUB_SHA" || "$TAG_VERIFIED" != true || "$COMMIT_VERIFIED" != true ]]; then
            echo "::error::The signed release tag moved or lost verification"
            exit 1
          fi

          mapfile -t TARBALLS < <(find package-artifact -maxdepth 1 -type f -name '*.tgz')
          if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one package tarball"
            exit 1
          fi
          tar -xOzf "${TARBALLS[0]}" package/package.json |
            jq -e --arg version "$EXPECTED_VERSION" '.name == "photostructure" and .version == $version' > /dev/null

          if [[ "$NPM_TAG" == beta ]]; then
            npm stage publish "./${TARBALLS[0]}" --ignore-scripts --tag beta
          elif [[ "$NPM_TAG" == latest ]]; then
            npm stage publish "./${TARBALLS[0]}" --ignore-scripts
          else
            echo "::error::Unsupported npm dist-tag: $NPM_TAG"
            exit 1
          fi
