name: Build Docker Images

on:
  push:
    # We only want to build on tags--if we include branches, we build twice.
    # branches:
    #   - main
    #   - alpha
    #   - beta
    tags:
      - v*

# Images are built here, in the public distribution repo, from the tag that
# publication pushed -- so their provenance and attestations name this repo and
# this ref rather than a maintainer's workstation. Docker is a pull surface, so
# it is allowed to lag the rest of the release by the length of this build.

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag's alias list spans several channels: a beta build moves :beta and
      # :alpha, and a stable build moves :stable and :latest. Authority over
      # each of those lives on its own branch, and publication pushes the channel
      # branches and the tag together, so a branch that has moved on means this
      # release is stale.
      #
      # Stale means stale for the whole release, not just Docker: RELEASE.md
      # retires re-running a superseded build in favour of a new patch version.
      # So refuse the build outright rather than publish some subset of aliases.
      #
      # This runs before the build, so two releases overlapping inside one build
      # window can still race. Releases are sequential and human-paced, and the
      # stale-means-new-version rule keeps re-runs out, so that is accepted.
      #
      # A stable release also moves :beta and :alpha only when prepare-server.sh
      # advanced those branches to it, which it skips while a beta line is in
      # progress. So a stable tag is stale only when main has moved on, and each
      # of :beta and :alpha moves only if its branch holds this exact version --
      # a stable re-run cannot roll those users back.
      - name: Refuse to publish a superseded release
        id: channels
        run: |
          set -euo pipefail
          TAG_VERSION=${GITHUB_REF_NAME#v}
          case "$GITHUB_REF_NAME" in
            *prealpha*) CHANNELS="" ;;
            *alpha*)    CHANNELS="alpha" ;;
            *beta*)     CHANNELS="alpha beta" ;;
            *)          CHANNELS="alpha beta main" ;;
          esac
          ALIASES=""
          for branch in $CHANNELS; do
            git fetch --no-tags --depth=1 origin "$branch"
            CURRENT=$(git show FETCH_HEAD:package.json | jq -er .version)
            if [[ "$CURRENT" == "$TAG_VERSION" ]]; then
              echo "origin/$branch is at $TAG_VERSION"
              ALIASES="$ALIASES $branch"
            elif [[ "$TAG_VERSION" != *-* && "$branch" != main ]]; then
              echo "origin/$branch holds $CURRENT; leaving :$branch alone"
            else
              echo "::error::$GITHUB_REF_NAME is superseded -- origin/$branch is at $CURRENT. Release a new version instead of re-running this build."
              exit 1
            fi
          done
          for alias in alpha beta; do
            if [[ " $ALIASES " == *" $alias "* ]]; then
              echo "$alias=true" >> "$GITHUB_OUTPUT"
            else
              echo "$alias=false" >> "$GITHUB_OUTPUT"
            fi
          done

      # https://docs.docker.com/build/ci/github-actions/manage-tags-labels/
      # https://github.com/docker/metadata-action#tags-input
      # https://docs.github.com/en/actions/learn-github-actions/contexts#github-context

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            photostructure/server
            ghcr.io/photostructure/server
          flavor: |
            latest=false
          # https://specs.opencontainers.org/image-spec/annotations/#pre-defined-annotation-keys
          labels: |
            org.opencontainers.image.title="PhotoStructure"
            org.opencontainers.image.description="Your new home for all your photos and videos"
            org.opencontainers.image.licenses="SEE LICENSE IN LICENSE.md"
            org.opencontainers.image.url="https://photostructure.com/"
            org.opencontainers.image.documentation="https://photostructure.com/server/photostructure-for-docker/"
          tags: |
            # always include the full semver (v1.2.3-alpha.1)
            type=semver,pattern={{version}}
            # minimal git SHA tag
            type=sha
            # tag every build as a :prealpha build
            type=raw,value=prealpha
            # :alpha and :beta move only when their server branch was advanced to
            # this version (see "Refuse to publish a superseded release"):
            type=raw,value=alpha,enable=${{ steps.channels.outputs.alpha == 'true' }}
            type=raw,value=beta,enable=${{ steps.channels.outputs.beta == 'true' }}
            # if it's not *alpha or beta, update :stable, :latest, and version tags.
            type=raw,value=stable,enable=${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') }}
            type=semver,pattern=v{{major}},enable=${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
